# Default configuration for the Bengali sentence-VAE experiments.
# Override any leaf with:  --set train.epochs=5 model.latent_dim=16

seed: 13
device: auto            # auto | cpu | cuda | mps

data:
  train: data/processed/train.txt
  val: data/processed/val.txt
  test: data/processed/test.txt
  max_sentences: null
  min_chars: 2
  max_tokens: 40        # includes <bos>/<eos>; set per tokenizer, see data/README.md
  labels: null          # optional gold-label TSV, see data/README.md

tokenizer:
  type: bpe             # char | word | bpe | morph
  vocab_size: 8000
  min_frequency: 2
  model_path: null      # reuse a saved tokenizer directory
  morph:
    suffixes: null      # null -> built-in Bengali suffix list

model:
  emb_dim: 128
  hidden_dim: 256
  latent_dim: 32
  enc_layers: 1
  dec_layers: 1
  dropout: 0.3
  decoder: lstm         # lstm | cnn
  bidirectional: true
  skip_connection: false
  tie_embeddings: true

train:
  epochs: 20
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  clip: 5.0
  word_dropout: 0.3
  free_bits: 0.0        # nats per latent dimension; 0 disables
  encoder_lag: 1        # update encoder every N steps (1 = every step)
  num_workers: 0
  log_every: 50
  eval_every: 1
  probe_every: 2
  max_batches: null     # smoke tests / debugging
  kl:
    schedule: linear    # constant | linear | cyclical
    warmup_epochs: 10
    cycles: 4
    ratio: 0.5

logging:
  run_dir: runs
  run_name: null
